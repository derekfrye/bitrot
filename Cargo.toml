[package]
name = "bitrot"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A resilient file corruption detection and recovery format"

[dependencies]
blake3 = "1.8.7"
crc = "3.4.0"
reed-solomon-simd = "=3.1.0"

[[bench]]
name = "crc_compare"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "deny"
