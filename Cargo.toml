[package]
name = "bitrot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A resilient file corruption detection and recovery format"

[dependencies]
blake3 = "1.8.7"

[dev-dependencies]
crc = "3.4.0"

[[bench]]
name = "crc_compare"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
