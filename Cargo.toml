[package]
name = "bitrot"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A resilient file corruption detection and recovery format"

[dependencies]
blake3 = "1.8.7"
crc = "3.4.0"
reed-solomon-simd = "=3.1.0"

[target.'cfg(any(unix, windows))'.dependencies]
cap-std = "4.0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "redox", target_vendor = "apple"))'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[[bench]]
name = "crc_compare"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "deny"
